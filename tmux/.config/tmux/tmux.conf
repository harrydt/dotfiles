# Terminal: tmux-256color inside, kitty outside
set -g default-terminal "tmux-256color"
# tmux-256color terminfo has no Ss/Se; teach tmux DECSCUSR so nvim can
# switch the cursor (beam in insert, block in normal).
# Use \033, not \E: tmux.conf drops the backslash and sends a literal "E".
set -ga terminal-overrides ",*:Ss=\033[%p1%d q:Se=\033[2 q"
# Indexed so reloading doesn't append duplicates
set -s terminal-features[3] "xterm-kitty:RGB:usstyle:clipboard:hyperlinks:extkeys:focus:sync"

# Neovim
set -sg escape-time 10
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -g set-clipboard on

# Window title follows session, so the kitty tab and Hyprland/waybar show it
set -g set-titles on
set -g set-titles-string "#S: #W"

set -g mouse on
set -g mode-keys vi
set -g status-keys emacs
set -g display-time 4000
set -g status-interval 5
setw -g aggressive-resize on
set -g history-limit 50000
# cycle windows: hold prefix, tap n/p; prefix C-b sends a real Ctrl-b
bind C-p previous-window
bind C-n next-window
bind C-b send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# Splits/windows open in the current directory (mirrors kitty alt+- / alt+v)
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Ctrl-hjkl moves across nvim splits and tmux panes (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# The navigator takes C-l/C-k from the shell; get them back via the prefix
bind C-l send-keys C-l
bind C-k send-keys C-k

# Resize panes (mirrors kitty alt+arrows)
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 3
bind -r Down resize-pane -D 3

# Plugins (TPM). Keep the run-shell TPM line at the bottom of this file.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
# resurrect defaults to prefix C-s, which is the workmux dashboard; move save
# to prefix S and keep restore on prefix C-r (reload is lowercase r)
set -g @resurrect-save 'S'
set -g @resurrect-restore 'C-r'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# workmux
bind C-s display-popup -h 30 -w 100 -E "workmux dashboard"
bind l run-shell "workmux last-done"
bind Tab run-shell "workmux last-agent"

# Catppuccin mocha, to match kitty and nvim
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#b4befe,bold] #S #[default] "
set -g status-left-length 40
setw -g window-status-current-style "fg=#cba6f7,bold"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"

# Status bar: workmux-line (https://github.com/harrydt/workmux-line, colours in
# ~/.config/workmux-line/config.toml) replaces the status-left/right and styles
# above. Before TPM, so plugins that hook status-right (tmux-continuum's
# auto-save) attach to it. Reload with prefix r.
# Install: cargo install --git https://github.com/harrydt/workmux-line
run-shell 'workmux-line apply'

# TPM (keep at the very bottom)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
run-shell "~/.tmux/plugins/tpm/tpm"
